name: Deploy Legal Pages

# Publishes only docs/legal/ to GitHub Pages so the App Store-required
# privacy / terms / support pages are reachable at:
#   https://gamesushi.github.io/anitrip/privacy_policy.html
#   https://gamesushi.github.io/anitrip/terms_of_service.html
#   https://gamesushi.github.io/anitrip/support.html
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['docs/legal/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-legal
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/legal

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
